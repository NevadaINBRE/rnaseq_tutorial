site_name: Introduction to RNA-Seq - From quality control to pathway analysis

nav:
    - Home: index.md
    - Precourse preparations: precourse.md
    - Slides notes (draft): slides_notes.md
    - Cheatsheets: cheatsheets.md
    - Tutorial :
        - RNAseq - technologies and design : days/design.md
        - Server login + unix fresh up : days/server_login.md
        - Quality control : days/quality_control.md
        - Sequence trimming : days/trimming.md
        - Reads mapping : days/mapping.md
        - Quantification Matrix : days/counting.md
        - Differential Expression Inference : days/DE.md
        - Enrichment analysis : days/enrichment.md



site_url: https://nevadainbre.github.io/rnaseq_tutorial/
repo_name: NevadaINBRE/rnaseq_tutorial
repo_url: https://github.com/NevadaINBRE/rnaseq_tutorial
edit_uri: edit/main/docs/

copyright: Copyright &copy; 2026 University of Nevada, Reno

theme:
  name: material
  logo: assets/images/university-logo.svg
  favicon: assets/images/university-logo.svg
  palette:
    primary: custom
    accent: blue
  features:
    - content.code.copy
    - content.code.annotate
    - navigation.top
    - navigation.footer

extra_css:
  - stylesheets/extra.css

extra:
  version:
    provider: mike

markdown_extensions:
  - abbr
  - def_list
  - footnotes
  - tables
  - admonition
  - codehilite:
      guess_lang: false
  - sane_lists
  - smarty
  - toc
  - pymdownx.superfences
  - attr_list
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.keys
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg


